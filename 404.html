<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1117">
<title>Page not found | Tenet Networks</title>
<link rel="icon" href="/images/icons/logo.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #0d1117; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  main { max-width: 520px; }
  img { width: 56px; height: auto; margin-bottom: 24px; }
  .code { font-size: 14px; letter-spacing: .12em; color: #8b949e; margin: 0 0 8px; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  p { color: #8b949e; line-height: 1.6; margin: 0 0 28px; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a { color: #e6edf3; text-decoration: none; padding: 10px 18px; border: 1px solid #30363d; border-radius: 8px; }
  a.primary { background: #1f6feb; border-color: #1f6feb; }
  a:hover { border-color: #8b949e; }
</style>
</head>
<body>
<main>
  <a href="/" style="border:0;padding:0"><img src="/images/icons/logo.png" alt="Tenet Networks"></a>
  <p class="code">404</p>
  <h1>We couldn't find that page</h1>
  <p>The page may have moved or no longer exists. Try one of these instead.</p>
  <nav>
    <a class="primary" href="/">Home</a>
    <a href="/products/portfolio">Products</a>
    <a href="/services/custom">Services</a>
    <a href="/contact">Contact</a>
  </nav>
</main>
</body>
</html>
